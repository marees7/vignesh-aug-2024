paths:
  /posts:
    get:
      consumes:
      - application/json
      description: User or admin get all job details
      parameters:
      - description: Search by company_name
        in: query
        name: company_name
        type: string
      - description: Search by job_role
        in: query
        name: job_role
        type: string
      - description: Search by country
        in: query
        name: country
        type: string
      - description: Search by limit
        in: query
        name: limit
        type: integer
      - description: Search by offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Get All Job Posts
      tags:
      - User
  /v1/admin:
    get:
      consumes:
      - application/json
      description: Admin get by his id to know about how many post created
      parameters:
      - default: Bearer
        description: Insert your access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Search by Job Role
        in: query
        name: job_role
        type: string
      - description: Search by Country
        in: query
        name: country
        type: string
      - description: Search by limit
        in: query
        name: limit
        type: integer
      - description: Search by offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - ApiKeyAuth: []
      summary: GetJobsCreated
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: admin creates new JobPost
      parameters:
      - default: Bearer
        description: Insert your access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Job
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.JobCreation'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - ApiKeyAuth: []
      summary: CreateJobPost
      tags:
      - Admin
  /v1/admin/:
    delete:
      consumes:
      - application/json
      description: Delete  Job Posts automatically
      parameters:
      - default: Bearer
        description: Insert your access token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "304":
          description: Not Modified
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - ApiKeyAuth: []
      summary: Delete Job Posts
      tags:
      - Admin
  /v1/admin/{job_id}:
    put:
      consumes:
      - application/json
      description: Admin update by jobid and admin id
      parameters:
      - default: Bearer
        description: Insert your access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: JobID
        in: path
        name: job_id
        required: true
        type: integer
      - description: Job
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.JobCreation'
      produces:
