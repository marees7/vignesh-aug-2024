definitions:
  dto.ApplicantDetail:
    properties:
      country:
        type: string
      created_at:
        type: integer
      email:
        type: string
      experience:
        type: integer
      job_id:
        type: integer
      job_role:
        type: string
      language:
        type: string
      name:
        type: string
      phone_number:
        type: string
      skills:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  dto.LoginUser:
    properties:
      message:
        type: string
      role_type:
        type: string
      token:
        type: string
      user_id:
        type: integer
    type: object
  dto.Response:
    properties:
      data: {}
      error:
        type: string
      job_status:
        type: string
      limit:
        type: integer
      message:
        type: string
      offset:
        type: integer
      total:
        type: integer
      vacancy:
        type: integer
    type: object
  models.Address:
    properties:
      city:
        type: string
      state:
        type: string
      street:
        type: string
      zip_code:
        type: string
    type: object
  models.JobCreation:
    properties:
      address:
        $ref: '#/definitions/models.Address'
      admin_id:
        type: integer
      company_email:
        type: string
      company_name:
        type: string
      country:
        type: string
      created_at:
        type: string
      description:
        type: string
      experience:
        type: string
      job_id:
        type: integer
      job_role:
        type: string
      job_status:
        type: string
      job_time:
        type: string
      skills:
        type: string
      updated_at:
        type: string
      vacancy:
        type: integer
    required:
    - vacancy
    type: object
  models.UserDetails:
    properties:
      created_at:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone_number:
        type: string
      role_type:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  models.UserJobDetails:
    properties:
      Job:
        $ref: '#/definitions/models.JobCreation'
      User:
        $ref: '#/definitions/models.UserDetails'
      country:
        type: string
      created_at:
        type: string
      experience:
        type: integer
      job_id:
        type: integer
      job_role:
        type: string
      language:
        type: string
      skills:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: vigneshwart2002@gmail.com
